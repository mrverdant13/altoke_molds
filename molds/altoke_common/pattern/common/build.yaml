#{% if use_code_generation %}#
targets:
  $default:
    builders:
      #{% if use_dart_mappable %}#
      dart_mappable_builder:
        generate_for:
          - lib/src/types/optional.dart
        options:
          generateMethods:
            - stringify
      #{% endif %}#
      #{% if use_freezed %}#
      freezed:
        generate_for:
          - lib/src/types/optional.dart
        options:
          copy_with: false
          map: false
          when: false
      #{% endif %}#
#{% endif %}#
