name: altoke_common

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
    paths:
      - molds/altoke_common/**
      - .github/workflows/altoke_common.yaml
  push:
    branches:
      - main
    paths:
      - molds/altoke_common/**
      - .github/workflows/altoke_common.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern:
    name: Pattern
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: molds/altoke_common/pattern/common
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Dart
        uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Format
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Test
        run: dart test
